[tool.poetry]
name = "fintech-antifraud-ml"
version = "0.1.0"
description = "Production-grade antifraud ML system: data validation, feature engineering, training, evaluation, and artifacts."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "^2.2.2"
numpy = "^2.0.1"
scikit-learn = "^1.5.1"
pyyaml = "^6.0.2"
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
typer = "^0.12.3"
rich = "^13.7.1"
joblib = "^1.4.2"
scipy = "^1.14.1"
fastapi = "^0.112.0"
uvicorn = { version = "^0.30.6", extras = ["standard"] }
prometheus-client = "^0.20.0"
click = ">=8.1.7,<8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-cov = "^5.0.0"
mypy = "^1.11.1"
ruff = "^0.6.2"
black = "^24.8.0"
types-pyyaml = "^6.0.12.20240808"
httpx = "^0.27.2"

[tool.poetry.scripts]
antifraud = "app.cli.main:app_entry"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "C4", "PIE", "RUF", "PL"]
ignore = [
  "PLR0913",
  "PLR2004"
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_decorators = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "sklearn.*",
  "joblib.*",
  "scipy.*",
  "fastapi.*",
  "starlette.*",
  "uvicorn.*",
  "httpx.*",
  "prometheus_client.*",
  "click.*",
  "typer.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
